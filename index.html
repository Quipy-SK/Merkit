<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Шежіре Меркіт</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #0E0902;
  --panel:    #16100A;
  --border:   #2E1C08;
  --border2:  #3A2810;
  --gold:     #C89828;
  --gold-hi:  #F0C84A;
  --gold-dim: #7A5C16;
  --text:     #EAD8A0;
  --text-dim: #7A6238;
  --female:   #C06838;
  --wife:     #9A7868;
  --zh:       #C88030;
  --sa:       #4A8890;
  --bu:       #6A9848;
  --to:       #A84840;
  --bar-h:    120px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; background: var(--bg); color: var(--text);
  font-family: 'EB Garamond', serif; overflow: hidden;
  -webkit-text-size-adjust: 100%;
}

/* ══ HEADER ══ */
header {
  display: flex; align-items: center;
  padding: 0 20px; height: 60px;
  background: linear-gradient(180deg, #1A1006 0%, #100C04 100%);
  border-bottom: 1px solid var(--border2);
  position: relative; z-index: 100;
  gap: 12px; flex-shrink: 0;
}
.hdr-tamga { filter: drop-shadow(0 0 8px rgba(200,152,40,.5)); flex-shrink: 0; }
.hdr-title { flex: 1; min-width: 0; }
.hdr-title h1 {
  font-family: 'Cinzel', serif; font-size: 14px; letter-spacing: .18em;
  color: var(--gold); text-transform: uppercase; line-height: 1.1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.hdr-title p { font-size: 10px; color: var(--text-dim); letter-spacing: .06em; margin-top: 2px; }

/* desktop branch filters in header */
.hdr-filters {
  display: flex; gap: 6px; align-items: center;
}
.bf-btn {
  padding: 5px 12px; border-radius: 20px; border: 1px solid transparent;
  font-family: 'EB Garamond', serif; font-size: 12px; cursor: pointer;
  transition: all .2s; background: transparent; color: var(--text-dim);
  white-space: nowrap; -webkit-tap-highlight-color: transparent;
}
.bf-btn:hover { border-color: currentColor; }

/* ══ BODY LAYOUT ══ */
.layout {
  display: flex; flex-direction: column;
  height: calc(100vh - 60px);
}
#tree-wrap { flex: 1; position: relative; overflow: hidden; min-height: 0; }
#tree-svg { width: 100%; height: 100%; cursor: grab; touch-action: none; }
#tree-svg:active { cursor: grabbing; }

/* ══ DESKTOP ZOOM CONTROLS ══ */
.zoom-controls {
  position: absolute; bottom: 20px; right: 20px;
  display: flex; flex-direction: column; gap: 4px; z-index: 10;
}
.zc-btn {
  width: 36px; height: 36px; border-radius: 8px;
  background: #1C1208; border: 1px solid var(--border2);
  color: var(--text-dim); font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s; font-family: monospace;
  -webkit-tap-highlight-color: transparent;
}
.zc-btn:hover, .zc-btn:active { background: #2A1A0A; border-color: var(--gold); color: var(--gold); }
.zc-sep { height: 4px; }

/* ══ DESKTOP LEGEND ══ */
.legend {
  position: absolute; bottom: 20px; left: 20px; z-index: 10;
  background: rgba(14,9,2,.9); border: 1px solid var(--border2);
  border-radius: 8px; padding: 12px 16px;
}
.legend-title { font-size: 9px; color: var(--text-dim); letter-spacing: .15em; text-transform: uppercase; margin-bottom: 8px; }
.legend-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.legend-row:last-child { margin-bottom: 0; }
.lc { width: 10px; height: 10px; border-radius: 50%; border: 2px solid; flex-shrink: 0; }
.legend-row span { font-size: 11px; color: var(--text-dim); }
.legend-shapes { display: flex; gap: 12px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
.ls-item { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--text-dim); }

/* ══ D3 ══ */
.link { fill: none; stroke-width: 1.5px; opacity: .5; }
.link-zhaman   { stroke: var(--zh); }
.link-saki     { stroke: var(--sa); }
.link-buryt    { stroke: var(--bu); }
.link-toktagan { stroke: var(--to); }
.link-main     { stroke: #706858; }
.node { cursor: pointer; }
.node .node-shape { stroke-width: 1.8px; transition: filter .2s; }
.node:hover .node-shape { filter: drop-shadow(0 0 5px rgba(200,152,40,.6)); }
.node.hl .node-shape { filter: drop-shadow(0 0 9px var(--gold-hi)); stroke: var(--gold-hi) !important; stroke-width: 2.5px !important; }
.node text {
  font-family: 'EB Garamond', serif; font-size: 11px; fill: var(--text);
  pointer-events: none; paint-order: stroke;
  stroke: rgba(14,9,2,.85); stroke-width: 3px;
}
.node .expand { font-size: 8px; fill: var(--text-dim); pointer-events: none; }
.node.search-dim { opacity: .15; }
.spouse-wrap { cursor: pointer; }
.spouse-label {
  font-family: 'EB Garamond', serif; font-size: 10px;
  fill: #9870B0; pointer-events: none; font-style: italic;
  paint-order: stroke; stroke: rgba(14,9,2,.9); stroke-width: 3px;
}

/* ══ TOOLTIP ══ */
#tooltip {
  position: fixed; pointer-events: none; z-index: 500;
  background: rgba(22,16,10,.96); border: 1px solid var(--border2);
  border-radius: 6px; padding: 7px 11px;
  font-size: 12px; color: var(--text);
  opacity: 0; transition: opacity .15s; max-width: 200px;
}

/* ══ MOBILE BOTTOM BAR ══ */
.bottom-bar {
  display: none;
  background: #12100A;
  border-top: 1px solid var(--border2);
  flex-shrink: 0;
}
.bottom-bar-inner {
  padding: 10px 14px 12px;
  display: flex; flex-direction: column; gap: 10px;
}

/* Zoom row */
.mob-zoom-row {
  display: flex; gap: 8px; justify-content: space-between;
}
.mzc {
  flex: 1; height: 44px; border-radius: 10px;
  background: #1C1208; border: 1px solid var(--border2);
  color: var(--text-dim); font-size: 20px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-family: monospace; -webkit-tap-highlight-color: transparent;
  transition: background .1s, color .1s;
}
.mzc:active { background: #2A1A0A; border-color: var(--gold); color: var(--gold); }
.mzc-sm { font-size: 14px; }

/* Branch filter row */
.mob-branch-row {
  display: flex; gap: 8px; overflow-x: auto;
  scrollbar-width: none; padding-bottom: 2px;
}
.mob-branch-row::-webkit-scrollbar { display: none; }
.mbb {
  flex-shrink: 0; height: 36px; padding: 0 14px;
  border-radius: 18px; border: 1px solid var(--border2);
  background: #1A1208; color: var(--text-dim);
  font-family: 'EB Garamond', serif; font-size: 13px;
  cursor: pointer; white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
  transition: border-color .15s, color .15s;
}
.mbb.active { border-color: var(--gold); color: var(--gold); }
.mbb[data-branch="zhaman"].active { border-color: var(--zh); color: var(--zh); }
.mbb[data-branch="saki"].active   { border-color: var(--sa); color: var(--sa); }
.mbb[data-branch="buryt"].active  { border-color: var(--bu); color: var(--bu); }
.mbb[data-branch="toktagan"].active { border-color: var(--to); color: var(--to); }

/* ══ MOBILE: only show bottom bar, hide desktop chrome ══ */
@media (max-width: 700px) {
  .hdr-title p  { display: none; }
  .hdr-filters  { display: none; }
  .zoom-controls { display: none; }
  .legend { display: none; }
  .bottom-bar { display: block; }
  header { height: 52px; padding: 0 14px; }
  .layout { height: calc(100vh - 52px); }
  #tree-svg { cursor: default; }
}
/* safe-area for notched phones */
@supports (padding-bottom: env(safe-area-inset-bottom)) {
  @media (max-width: 700px) {
    .bottom-bar-inner { padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
  }
}
</style>

// ══════════════════════════════════════════════════════
//  CONSTANTS
// ══════════════════════════════════════════════════════
const branchC     = {zhaman:'#C88030', saki:'#4A8890', buryt:'#6A9848', toktagan:'#A84840', main:'#706858'};
const branchFillM = {zhaman:'rgba(200,128,48,.3)', saki:'rgba(74,136,144,.3)', buryt:'rgba(106,152,72,.3)', toktagan:'rgba(168,72,64,.3)', main:'rgba(112,104,88,.22)'};
const branchNames = {zhaman:'Жаман тармағы', saki:'Сәкі тармағы', buryt:'Бүріт тармағы', toktagan:'Тоқтаған тармағы'};
function getBranch(d){ let n=d; while(n){ if(n.data.branch) return n.data.branch; n=n.parent; } return 'main'; }

// ══════════════════════════════════════════════════════
//  SVG SETUP
// ══════════════════════════════════════════════════════
const isMobile = () => window.innerWidth <= 700;
const svg = d3.select('#tree-svg');
let W = window.innerWidth;
let H = window.innerHeight - 60;
svg.attr('viewBox',`0 0 ${W} ${H}`);

const g = svg.append('g');
const zoom = d3.zoom().scaleExtent([0.04, 6]).on('zoom', e => g.attr('transform', e.transform));
svg.call(zoom);

const tree = d3.tree().nodeSize([38, 185]).separation((a,b) => a.parent===b.parent ? 1.1 : 2.2);
const root = d3.hierarchy(DATA);
root.x0 = H/2; root.y0 = 0;

// Collapse nodes beyond depth 5 by default (shows all 4 branches + their first level)
root.descendants().forEach(d => {
  if(d.depth >= 6 && d.children){ d._children = d.children; d.children = null; }
});

let uid = 0;
function getUID(d){ if(!d._uid) d._uid = 'n'+(uid++); return d._uid; }

// ══════════════════════════════════════════════════════
//  INITIAL ZOOM — smarter for mobile
// ══════════════════════════════════════════════════════
function getInitialTransform(){
  if(isMobile()){
    return d3.zoomIdentity.translate(50, H/2).scale(0.55);
  }
  return d3.zoomIdentity.translate(120, H/2).scale(0.72);
}
let initialT = getInitialTransform();

// ══════════════════════════════════════════════════════
//  SPOUSE LAYER
// ══════════════════════════════════════════════════════
const swLayer = g.append('g').attr('class','spouse-layer');

function updateSpouses(nodes){
  const withSpouse = nodes.filter(d => d.data.spouse);
  const sw = swLayer.selectAll('.spouse-wrap').data(withSpouse, d => d.data.id+'_w');
  const swE = sw.enter().append('g').attr('class','spouse-wrap')
    .attr('transform', d => `translate(${d.y0||0},${d.x0||0})`)
    .style('opacity',0).style('cursor','pointer')
    .on('click',(ev,d) => ev.stopPropagation())
    .on('mouseenter',(ev,d) => showTooltip(ev, d.data.spouse+(d.data.spouseInfo?'\n'+d.data.spouseInfo:'')))
    .on('mouseleave', hideTooltip);
  swE.append('text').attr('class','spouse-label');
  const swAll = swE.merge(sw);
  swAll.select('text.spouse-label')
    .attr('x', d => (d.children||d._children)?-10:10).attr('y',0).attr('dy','1.6em')
    .attr('text-anchor', d => (d.children||d._children)?'end':'start')
    .text(d => '♦ '+d.data.spouse);
  swAll.transition().duration(400).ease(d3.easeCubicOut)
    .attr('transform', d => `translate(${d.y},${d.x})`).style('opacity',1);
  sw.exit().transition().duration(300).style('opacity',0).remove();
  swLayer.raise();
}

// ══════════════════════════════════════════════════════
//  MAIN UPDATE
// ══════════════════════════════════════════════════════
function update(src){
  tree(root);
  const nodes = root.descendants();
  const links = root.links();

  const link = g.selectAll('.link').data(links, d => getUID(d.target));
  link.enter().insert('path','.node')
    .attr('class', d => 'link link-'+(getBranch(d.target)||'main'))
    .attr('d', () => d3.linkHorizontal().x(()=>src.y0||0).y(()=>src.x0||0)({source:{},target:{}}))
    .merge(link).transition().duration(400).ease(d3.easeCubicOut)
    .attr('class', d => 'link link-'+(getBranch(d.target)||'main'))
    .attr('d', d3.linkHorizontal().x(d=>d.y).y(d=>d.x));
  link.exit().transition().duration(300)
    .attr('d', ()=>d3.linkHorizontal().x(()=>src.y).y(()=>src.x)({source:{},target:{}})).remove();

  const node = g.selectAll('.node').data(nodes, d => getUID(d));
  const nE = node.enter().append('g')
    .attr('class', d => 'node '+(d.data.g==='f'?'f':'m'))
    .attr('transform', d =>`translate(${src.y||0},${src.x||0})`)
    .style('opacity', 1);

  // Larger invisible hit area for touch
  nE.append('rect').attr('class','hit-area')
    .attr('x',-18).attr('y',-18).attr('width',36).attr('height',36)
    .attr('fill','transparent').attr('stroke','none');
  nE.append('rect').attr('class','node-shape')
    .attr('x',-6).attr('y',-6).attr('width',12).attr('height',12).attr('rx',2)
    .attr('transform', d => d.data.g==='f'?'rotate(45)':'');
  nE.append('text').attr('class','expand').attr('dy','0.31em').attr('text-anchor','middle');
  nE.append('text')
    .attr('dy','0.31em')
    .attr('x', d => (d._children||d.children)?-12:12)
    .attr('text-anchor', d => (d._children||d.children)?'end':'start')
    .text(d => d.data.name)
    .style('font-size', d => d.depth<=4?'12px':'10px')
    .style('font-weight', d => d.depth<=3?'600':'400');

  nE.on('click', (ev,d) => ev.stopPropagation())
    .on('dblclick', (ev,d) => {
      ev.stopPropagation();
      toggleNode(d);
    })
    .on('mouseenter', (ev,d) => {
      if(isMobile()) return;
      const ch = (d.children||[]).length+(d._children||[]).length;
      if(ch>0) showTooltip(ev, d.data.name+'\n'+ch+' бала · Екі рет басу');
    })
    .on('mouseleave', hideTooltip);

  const nAll = nE.merge(node);
  nAll.transition().duration(300).ease(d3.easeCubicOut)
    .attr('transform', d=>`translate(${d.y},${d.x})`)
    .style('opacity', 1);

  nAll.select('.node-shape').transition().duration(400)
    .attr('fill', d => d.data.g==='f'?'rgba(192,104,56,.25)':branchFillM[getBranch(d)])
    .attr('stroke', d => d.data.g==='f'?'#C06838':branchC[getBranch(d)])
    .attr('stroke-dasharray', d => d._children?'3,2':'none');

  nAll.select('.expand').text(d => d._children?'▸':'');
  nAll.select('text:not(.expand)')
    .attr('x', d=>(d._children||d.children)?-12:12)
    .attr('text-anchor', d=>(d._children||d.children)?'end':'start');

  node.exit().transition().duration(300)
    .attr('transform',()=>`translate(${src.y},${src.x})`).style('opacity',0).remove();
  nodes.forEach(d=>{ d.x0=d.x; d.y0=d.y; });
  updateSpouses(nodes);
}

function toggleNode(d){
  if(d.children){ d._children=d.children; d.children=null; }
  else if(d._children){ d.children=d._children; d._children=null; }
  update(d);
}

update(root);
// Apply initial zoom immediately (no transition)
fitAllInstant();

// ══════════════════════════════════════════════════════
//  ZOOM HELPERS
// ══════════════════════════════════════════════════════
function doZoom(f){ svg.transition().duration(300).call(zoom.scaleBy, f); }
function fitAllInstant(){
  tree(root);
  const nl = root.descendants();
  const xs=nl.map(d=>d.y), ys=nl.map(d=>d.x);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const pad=60;
  const cW = window.innerWidth;
  const cH = window.innerHeight - 60;
  const s=Math.min((cW-pad*2)/(x1-x0||1),(cH-pad*2)/(y1-y0||1), 1.5);
  const tx = pad - x0*s;
  const ty = cH/2 - (y0+y1)/2*s;
  svg.call(zoom.transform, d3.zoomIdentity.translate(tx,ty).scale(s));
}
function fitAll(){
  tree(root);
  const nl = root.descendants();
  const xs=nl.map(d=>d.y), ys=nl.map(d=>d.x);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const pad=60;
  const cW = window.innerWidth;
  const cH = window.innerHeight - 60;
  const s=Math.min((cW-pad*2)/(x1-x0||1),(cH-pad*2)/(y1-y0||1), 1.5);
  const tx = pad - x0*s;
  const ty = cH/2 - (y0+y1)/2*s;
  svg.transition().duration(600).ease(d3.easeCubicOut)
    .call(zoom.transform, d3.zoomIdentity.translate(tx,ty).scale(s));
}
function goHome(){ svg.transition().duration(500).call(zoom.transform, initialT); }

// Desktop zoom buttons
document.getElementById('zc-in').addEventListener('click',  ()=>doZoom(1.35));
document.getElementById('zc-out').addEventListener('click', ()=>doZoom(1/1.35));
document.getElementById('zc-fit').addEventListener('click',  fitAll);
document.getElementById('zc-home').addEventListener('click', goHome);

// Mobile zoom buttons
document.getElementById('mzc-in').addEventListener('click',  ()=>doZoom(1.4));
document.getElementById('mzc-out').addEventListener('click', ()=>doZoom(1/1.4));
document.getElementById('mzc-fit').addEventListener('click',  fitAll);
document.getElementById('mzc-home').addEventListener('click', goHome);

// ══════════════════════════════════════════════════════
//  BRANCH FILTER
// ══════════════════════════════════════════════════════
let activeBranch = 'all';
function applyBranchFilter(branch){
  activeBranch = branch;
  // Update all filter buttons (desktop + mobile)
  document.querySelectorAll('.bf-btn, .mbb').forEach(b => {
    const isActive = b.dataset.branch === branch;
    b.classList.toggle('active', isActive);
    if(b.classList.contains('bf-btn')){
      b.style.background = isActive && branch==='all' ? 'rgba(200,152,40,.1)' : '';
      b.style.borderColor = isActive && branch==='all' ? '#4A4030' : '';
    }
  });
  if(branch==='all'){
    g.selectAll('.node').classed('search-dim',false);
    g.selectAll('.link').style('opacity',.5);
  } else {
    g.selectAll('.node').classed('search-dim', d=>getBranch(d)!==branch);
    g.selectAll('.link').style('opacity', d=>getBranch(d.target)===branch?.7:.08);
  }
}
document.querySelectorAll('.bf-btn, .mbb').forEach(btn =>
  btn.addEventListener('click', ()=>applyBranchFilter(btn.dataset.branch))
);

// ══════════════════════════════════════════════════════
//  TOOLTIP
// ══════════════════════════════════════════════════════
const tooltip = document.getElementById('tooltip');
function showTooltip(ev,text){
  tooltip.style.opacity='1';
  tooltip.innerHTML=text.split('\n').join('<br>');
  tooltip.style.left=(ev.clientX+14)+'px';
  tooltip.style.top=(ev.clientY-10)+'px';
}
function hideTooltip(){ tooltip.style.opacity='0'; }

// ══════════════════════════════════════════════════════
//  DOUBLE-TAP (mobile expand/collapse)
// ══════════════════════════════════════════════════════
let lastTap=0, lastEl=null;
svg.on('touchend.dtap', function(ev){
  const now=Date.now();
  const el=ev.target;
  if(now-lastTap<300 && lastEl===el){
    ev.preventDefault();
    const t=ev.changedTouches[0];
    const nodeEl=document.elementFromPoint(t.clientX,t.clientY)?.closest('g.node');
    if(nodeEl){ const d=d3.select(nodeEl).datum(); if(d) toggleNode(d); }
  }
  lastTap=now; lastEl=el;
});

// ══════════════════════════════════════════════════════
//  KEYBOARD
// ══════════════════════════════════════════════════════
document.addEventListener('keydown', e=>{
  if(e.key==='+'||e.key==='=') doZoom(1.35);
  if(e.key==='-') doZoom(1/1.35);
  if(e.key==='f'||e.key==='F') fitAll();
  if(e.key==='h'||e.key==='H') goHome();
});

// ══════════════════════════════════════════════════════
//  RESIZE
// ══════════════════════════════════════════════════════
window.addEventListener('resize', ()=>{
  W=window.innerWidth;
  H=document.getElementById('tree-wrap').clientHeight||window.innerHeight-60;
  svg.attr('viewBox',`0 0 ${W} ${H}`);
  initialT=getInitialTransform();
});
</script>
