<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Шежіре Меркіт</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <svg class="hdr-tamga" width="34" height="40" viewBox="0 0 48 56" fill="none">
    <polygon points="29.8,13 40.6,22.7 29.8,35.6 19.5,22.7" stroke="#C89828" stroke-width="2.2" stroke-linejoin="round"/>
    <line x1="29.8" y1="13"   x2="16.7" y2="4"    stroke="#C89828" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="19.5" y1="22.7" x2="8.1"  y2="11.5" stroke="#C89828" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="19.5" y1="22.7" x2="6"    y2="35"   stroke="#C89828" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="29.8" y1="35.6" x2="11.3" y2="52"   stroke="#C89828" stroke-width="2.5" stroke-linecap="round"/>
  </svg>
  <div class="hdr-title">
    <h1>ШЕЖІРЕ МЕРКІТ</h1>
    <p>Меркіт · Абақ Керей · Орта Жүз</p>
  </div>
  <div class="hdr-filters">
    <button class="bf-btn active" data-branch="all" style="border-color:#4A4030;color:#C89828;background:rgba(200,152,40,.1)">Барлығы</button>
    <button class="bf-btn" data-branch="zhaman" style="color:#C88030">● Жаман</button>
    <button class="bf-btn" data-branch="saki"   style="color:#4A8890">● Сәкі</button>
    <button class="bf-btn" data-branch="buryt"  style="color:#6A9848">● Бүріт</button>
    <button class="bf-btn" data-branch="toktagan" style="color:#A84840">● Тоқтаған</button>
  </div>
</header>

<div class="layout">
  <div id="tree-wrap">
    <svg id="tree-svg"></svg>

    <div class="zoom-controls">
      <button class="zc-btn" id="zc-in">+</button>
      <button class="zc-btn" id="zc-out">−</button>
      <div class="zc-sep"></div>
      <button class="zc-btn" id="zc-fit" style="font-size:11px">⤢</button>
      <button class="zc-btn" id="zc-home" style="font-size:12px">⌂</button>
    </div>

    <div class="legend">
      <div class="legend-title">Тармақтар</div>
      <div class="legend-row"><div class="lc" style="border-color:#C88030;background:rgba(200,128,48,.2)"></div><span>Жаман</span></div>
      <div class="legend-row"><div class="lc" style="border-color:#4A8890;background:rgba(74,136,144,.2)"></div><span>Сәкі</span></div>
      <div class="legend-row"><div class="lc" style="border-color:#6A9848;background:rgba(106,152,72,.2)"></div><span>Бүріт</span></div>
      <div class="legend-row"><div class="lc" style="border-color:#A84840;background:rgba(168,72,64,.2)"></div><span>Тоқтаған</span></div>
    </div>

    <div class="panel" id="panel">
      <button class="panel-close" onclick="closePanel()">×</button>
      <h2 id="pname"></h2>
      <p class="panel-sub" id="psub"></p>
      <div id="pbranch"></div>
      <div class="panel-row">
        <span class="panel-label">Буын</span>
        <span id="pgen"></span>
      </div>
      <div id="pspouses"></div>
      <div class="panel-row" id="pnotef" style="display:none">
        <span class="panel-label">Ескерту</span>
        <span id="pnote"></span>
      </div>
    </div>
  </div>

  <div class="bottom-bar">
    <div class="bottom-bar-inner">
      <div class="mob-branch-row">
        <button class="mbb active" data-branch="all">Барлығы</button>
        <button class="mbb" data-branch="zhaman">● Жаман</button>
        <button class="mbb" data-branch="saki">● Сәкі</button>
        <button class="mbb" data-branch="buryt">● Бүріт</button>
        <button class="mbb" data-branch="toktagan">● Тоқтаған</button>
      </div>
    </div>
  </div>
</div>

<script src="js/d3.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
